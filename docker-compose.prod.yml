# Produksi VPS: full Docker stack (db + redis + app) + Caddy TLS — selaras docker-compose.yml lokal.
#   docker compose -f docker-compose.prod.yml --env-file .env -p bades-prod up -d

name: bades-prod

x-bades-app-env: &bades-app-env
  NODE_ENV: ${NODE_ENV:-production}
  NODE_PORT: 3000
  NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-0}
  PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
  SERVER_URL: ${SERVER_URL}
  FRONTEND_URL: ${FRONTEND_URL}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  DEFAULT_SUBDOMAIN: ${DEFAULT_SUBDOMAIN:-app}

  STORAGE_TYPE: ${STORAGE_TYPE:-local}
  STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
  STORAGE_S3_NAME: ${STORAGE_S3_NAME:-}
  STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
  STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
  STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}

  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
  APP_SECRET: ${APP_SECRET}

  IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED:-true}
  IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: ${IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS:-false}
  IS_MANAGED_HOSTING: ${IS_MANAGED_HOSTING:-true}
  IS_CONFIG_VARIABLES_IN_DB_ENABLED: ${IS_CONFIG_VARIABLES_IN_DB_ENABLED:-false}
  SIGN_IN_PREFILLED: ${SIGN_IN_PREFILLED:-false}
  IS_EMAIL_VERIFICATION_REQUIRED: ${IS_EMAIL_VERIFICATION_REQUIRED:-false}
  AUTH_PASSWORD_ENABLED: ${AUTH_PASSWORD_ENABLED:-true}
  IS_BILLING_ENABLED: ${IS_BILLING_ENABLED:-false}
  TRUST_PROXY_ENABLED: ${TRUST_PROXY_ENABLED:-true}
  OUTBOUND_HTTP_SAFE_MODE_ENABLED: ${OUTBOUND_HTTP_SAFE_MODE_ENABLED:-true}

  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  AI_MODEL_PREFERENCES: ${AI_MODEL_PREFERENCES:-}
  MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}

  EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Bades}
  EMAIL_SYSTEM_ADDRESS: ${EMAIL_SYSTEM_ADDRESS:-}
  EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
  EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
  EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}

  LOGGER_DRIVER: ${LOGGER_DRIVER:-CONSOLE}
  LOG_LEVELS: ${LOG_LEVELS:-error,warn}
  EXCEPTION_HANDLER_DRIVER: ${EXCEPTION_HANDLER_DRIVER:-console}
  TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}

services:
  server:
    image: ${BADES_IMAGE}
    networks:
      - bades-net
    expose:
      - "3000"
    volumes:
      - server-local-data:/app/packages/server/.local-storage
    env_file:
      - .env
    environment:
      <<: *bades-app-env
      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS:-}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 5
    restart: always

  worker:
    image: ${BADES_IMAGE}
    networks:
      - bades-net
    command: ["node", "dist/queue-worker/queue-worker"]
    volumes:
      - server-local-data:/app/packages/server/.local-storage
    env_file:
      - .env
    environment:
      <<: *bades-app-env
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16
    networks:
      - bades-net
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:-postgres}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7-bookworm
    networks:
      - bades-net
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory-policy noeviction
        else
          exec redis-server --maxmemory-policy noeviction
        fi
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG
          else
            redis-cli ping | grep -q PONG
          fi
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddybuilds/caddy-cloudflare:latest
    networks:
      - bades-net
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

volumes:
  db-data:
  server-local-data:
  caddy-data:
  caddy-config:

networks:
  bades-net:
    driver: bridge
