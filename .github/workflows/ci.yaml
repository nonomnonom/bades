name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install dependencies
        uses: ./.github/actions/yarn-install
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Nx menghitung urutan build via dependsOn `^build`; run-many memparalelkan
      # task yang independen (mis. front + emails) sekaligus.
      - name: Build all
        run: >-
          npx nx run-many -t build
          -p shared emails ui sdk server front client-sdk front-component-renderer

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install dependencies
        uses: ./.github/actions/yarn-install
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build oxlint plugin
        run: npx nx build oxlint-rules

      - name: Lint + format check
        run: npx nx run-many -t lint,fmt -p server front shared

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install dependencies
        uses: ./.github/actions/yarn-install
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Typecheck
        run: npx nx run-many -t typecheck -p server front shared
